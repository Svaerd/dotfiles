##! Noctalia v5 IPC binds
bind = SUPER, Space, exec, noctalia msg panel-toggle launcher
bind = SUPER, S, exec, noctalia msg panel-toggle control-center
bind = SUPER, Comma, exec, noctalia msg settings-toggle
bind = SUPER, Alt, L, exec, noctalia msg session lock-and-suspend
bind = SUPER, Semicolon, exec, noctalia msg panel-toggle session
bind = SUPER, V, exec, noctalia msg panel-toggle clipboard
bind = SUPER, Period, exec, noctalia msg panel-toggle launcher /emo
bind = SUPER, N, exec, noctalia msg panel-toggle control-center notifications
bind = SUPER, Shift, N, exec, noctalia msg notification-dnd-toggle
