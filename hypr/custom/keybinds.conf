# See https://wiki.hyprland.org/Configuring/Binds/
#!
##! User
bind = Ctrl+Super, Slash, exec, xdg-open ~/.config/illogical-impulse/config.json # Edit shell config
bind = Ctrl+Super+Alt, Slash, exec, nvim ~/.config/hypr/custom/keybinds.conf # Edit extra keybinds
binde = Alt, Tab, cyclenext, activewindow # Cycle Active Window
unbind = Super, Tab
bind = Super, Tab, workspace, previous # Cycle Active Workspace
bind = Super, Delete, exec, shutdown now # Shutdown
bind = Super, X, togglespecialworkspace, communications # Whatsapp workspace
bind = Super, Escape, exec, /home/host4/.config/hypr/custom/scripts/toggle_touchpad_click.sh # Toggle tap-to-click

bind = Super+Alt, Left, resizeactive, -50 0
bind = Super+Alt, Right, resizeactive, 50 0
bind = Super+Alt, Up, resizeactive, 0 50
bind = Super+Alt, Down, resizeactive, 0 -50

##! Apps
bind = Super, Z, exec, proton-pass
unbind = Super, Return
bind = Super, Return, exec, warp-terminal
